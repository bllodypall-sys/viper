name: VIPER smoke tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/viper-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate VIPER without production credentials
        run: node scripts/smoke-test.mjs
